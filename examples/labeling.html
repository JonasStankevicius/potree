<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Potree Labeling</title>

	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
</head>

<body>
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>

	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background-image: url('../build/potree/resources/images/background.jpg');"></div>
		<div id="potree_sidebar_container"> </div>
	</div>

	<script type="module">

		// Colour names accepted by THREE.Color. Potree bundles this table but does not
		// export it, so the labelling UI keeps its own copy to populate the dropdown.
		const _colorKeywords = {
			'aliceblue': 0xF0F8FF, 'antiquewhite': 0xFAEBD7, 'aqua': 0x00FFFF, 'aquamarine': 0x7FFFD4, 'azure': 0xF0FFFF,
			'beige': 0xF5F5DC, 'bisque': 0xFFE4C4, 'black': 0x000000, 'blanchedalmond': 0xFFEBCD, 'blue': 0x0000FF, 'blueviolet': 0x8A2BE2,
			'brown': 0xA52A2A, 'burlywood': 0xDEB887, 'cadetblue': 0x5F9EA0, 'chartreuse': 0x7FFF00, 'chocolate': 0xD2691E, 'coral': 0xFF7F50,
			'cornflowerblue': 0x6495ED, 'cornsilk': 0xFFF8DC, 'crimson': 0xDC143C, 'cyan': 0x00FFFF, 'darkblue': 0x00008B, 'darkcyan': 0x008B8B,
			'darkgoldenrod': 0xB8860B, 'darkgray': 0xA9A9A9, 'darkgreen': 0x006400, 'darkgrey': 0xA9A9A9, 'darkkhaki': 0xBDB76B, 'darkmagenta': 0x8B008B,
			'darkolivegreen': 0x556B2F, 'darkorange': 0xFF8C00, 'darkorchid': 0x9932CC, 'darkred': 0x8B0000, 'darksalmon': 0xE9967A, 'darkseagreen': 0x8FBC8F,
			'darkslateblue': 0x483D8B, 'darkslategray': 0x2F4F4F, 'darkslategrey': 0x2F4F4F, 'darkturquoise': 0x00CED1, 'darkviolet': 0x9400D3,
			'deeppink': 0xFF1493, 'deepskyblue': 0x00BFFF, 'dimgray': 0x696969, 'dimgrey': 0x696969, 'dodgerblue': 0x1E90FF, 'firebrick': 0xB22222,
			'floralwhite': 0xFFFAF0, 'forestgreen': 0x228B22, 'fuchsia': 0xFF00FF, 'gainsboro': 0xDCDCDC, 'ghostwhite': 0xF8F8FF, 'gold': 0xFFD700,
			'goldenrod': 0xDAA520, 'gray': 0x808080, 'green': 0x008000, 'greenyellow': 0xADFF2F, 'grey': 0x808080, 'honeydew': 0xF0FFF0, 'hotpink': 0xFF69B4,
			'indianred': 0xCD5C5C, 'indigo': 0x4B0082, 'ivory': 0xFFFFF0, 'khaki': 0xF0E68C, 'lavender': 0xE6E6FA, 'lavenderblush': 0xFFF0F5, 'lawngreen': 0x7CFC00,
			'lemonchiffon': 0xFFFACD, 'lightblue': 0xADD8E6, 'lightcoral': 0xF08080, 'lightcyan': 0xE0FFFF, 'lightgoldenrodyellow': 0xFAFAD2, 'lightgray': 0xD3D3D3,
			'lightgreen': 0x90EE90, 'lightgrey': 0xD3D3D3, 'lightpink': 0xFFB6C1, 'lightsalmon': 0xFFA07A, 'lightseagreen': 0x20B2AA, 'lightskyblue': 0x87CEFA,
			'lightslategray': 0x778899, 'lightslategrey': 0x778899, 'lightsteelblue': 0xB0C4DE, 'lightyellow': 0xFFFFE0, 'lime': 0x00FF00, 'limegreen': 0x32CD32,
			'linen': 0xFAF0E6, 'magenta': 0xFF00FF, 'maroon': 0x800000, 'mediumaquamarine': 0x66CDAA, 'mediumblue': 0x0000CD, 'mediumorchid': 0xBA55D3,
			'mediumpurple': 0x9370DB, 'mediumseagreen': 0x3CB371, 'mediumslateblue': 0x7B68EE, 'mediumspringgreen': 0x00FA9A, 'mediumturquoise': 0x48D1CC,
			'mediumvioletred': 0xC71585, 'midnightblue': 0x191970, 'mintcream': 0xF5FFFA, 'mistyrose': 0xFFE4E1, 'moccasin': 0xFFE4B5, 'navajowhite': 0xFFDEAD,
			'navy': 0x000080, 'oldlace': 0xFDF5E6, 'olive': 0x808000, 'olivedrab': 0x6B8E23, 'orange': 0xFFA500, 'orangered': 0xFF4500, 'orchid': 0xDA70D6,
			'palegoldenrod': 0xEEE8AA, 'palegreen': 0x98FB98, 'paleturquoise': 0xAFEEEE, 'palevioletred': 0xDB7093, 'papayawhip': 0xFFEFD5, 'peachpuff': 0xFFDAB9,
			'peru': 0xCD853F, 'pink': 0xFFC0CB, 'plum': 0xDDA0DD, 'powderblue': 0xB0E0E6, 'purple': 0x800080, 'rebeccapurple': 0x663399, 'red': 0xFF0000, 'rosybrown': 0xBC8F8F,
			'royalblue': 0x4169E1, 'saddlebrown': 0x8B4513, 'salmon': 0xFA8072, 'sandybrown': 0xF4A460, 'seagreen': 0x2E8B57, 'seashell': 0xFFF5EE,
			'sienna': 0xA0522D, 'silver': 0xC0C0C0, 'skyblue': 0x87CEEB, 'slateblue': 0x6A5ACD, 'slategray': 0x708090, 'slategrey': 0x708090, 'snow': 0xFFFAFA,
			'springgreen': 0x00FF7F, 'steelblue': 0x4682B4, 'tan': 0xD2B48C, 'teal': 0x008080, 'thistle': 0xD8BFD8, 'tomato': 0xFF6347, 'turquoise': 0x40E0D0,
			'violet': 0xEE82EE, 'wheat': 0xF5DEB3, 'white': 0xFFFFFF, 'whitesmoke': 0xF5F5F5, 'yellow': 0xFFFF00, 'yellowgreen': 0x9ACD32
		};

		function switchToElevation(gradient){
			viewer.scene.pointclouds.forEach(pc => {
				pc.material.activeAttributeName = "elevation";
				pc.material.gradient = gradient;
			});
		}

		function switchToRGB(){
			viewer.scene.pointclouds.forEach(pc => {
				let hasRGBA = pc.getAttributes().attributes.find(a => a.name === "rgba") !== undefined;
				pc.material.activeAttributeName = hasRGBA ? "rgba" : "color";
			});
		}

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

		viewer.setEDLEnabled(false);
		viewer.setFOV(60);
		viewer.setPointBudget(1_000_000);
		viewer.loadSettingsFromURL();
		viewer.setBackground("skybox");

		viewer.setDescription("Box labelling. Draw a box with the volume tool, assign a class, then export with the potree.json button under Measurements.");

		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			$("#menu_tools").next().show();
			$("#menu_clipping").next().show();
			viewer.toggleSidebar();

			// ---- Point Colors -------------------------------------------------

			let sectionColors = $(`
				<h3 id="menu_colors" class="accordion-header ui-widget"><span>Point Colors</span></h3>
				<div class="accordion-content ui-widget pv-menu-list"></div>
			`);

			let contentColors = sectionColors.last();
			contentColors.html(`
			<div class="pv-menu-list">
				<input id="btnSwitchToClassification" type="button" value="switch to classification"/>
				<input id="btnSwitchToRGB" type="button" value="switch to rgb"/>
				<input id="btnSwitchToElevation" type="button" value="switch to elevation (turbo)"/>
				<input id="btnSwitchToElevationSpectral" type="button" value="switch to elevation (spectral)"/>
				<input id="btnSwitchToElevationGray" type="button" value="switch to elevation (grayscale)"/>
			</div>
			`);
			sectionColors.first().click(() => contentColors.slideToggle());
			sectionColors.insertBefore($('#menu_appearance'));

			$("#btnSwitchToClassification").click(() => {
				viewer.scene.pointclouds.forEach(pc => {
					pc.material.activeAttributeName = "classification";
				});
			});
			$("#btnSwitchToRGB").click(() => switchToRGB());
			$("#btnSwitchToElevation").click(() => switchToElevation(Potree.Gradients.TURBO));
			$("#btnSwitchToElevationSpectral").click(() => switchToElevation(Potree.Gradients.SPECTRAL));
			$("#btnSwitchToElevationGray").click(() => switchToElevation(Potree.Gradients.GRAYSCALE));

			// ---- Selected Volume ----------------------------------------------

			let sectionVolume = $(`
				<h3 id="menu_volume" class="accordion-header ui-widget"><span>Selected Volume</span></h3>
				<div class="accordion-content ui-widget pv-menu-list"></div>
			`);

			let contentVolume = sectionVolume.last();
			contentVolume.html(`
				<div class="pv-menu-list">
					<div id="selectedVolumeInfo">No volume selected</div>
				</div>
			`);
			sectionVolume.first().click(() => contentVolume.slideToggle());
			sectionVolume.insertBefore($('#menu_appearance'));

			let classDropdown = $('<select id="classDropdown"></select>');
			let colorDropdown = $('<select id="colorDropdown"></select>');
			let classInput = $('<input type="text" id="classInput" placeholder="Enter new class name"/>');
			let addButton = $('<button id="addClassButton">Add</button>');

			// class name -> colour name. Add your own defaults here.
			let existingClasses = {};

			Object.keys(existingClasses).forEach(cls => {
				classDropdown.append(new Option(cls, cls));
			});
			Object.keys(_colorKeywords).forEach(colorKey => {
				colorDropdown.append(new Option(colorKey, colorKey));
			});

			contentVolume.append('<div>Assign Class:</div>');
			contentVolume.append(classDropdown);
			contentVolume.append(classInput);
			contentVolume.append(addButton);
			contentVolume.append('<div>Assign Color:</div>');
			contentVolume.append(colorDropdown);

			addButton.click(() => {
				let newClass = classInput.val().trim();
				if(newClass){
					classDropdown.append(new Option(newClass, newClass));
					classInput.val('');
				}
			});

			// assign the selected class to the selected volume
			classDropdown.change(() => {
				if(viewer.inputHandler.selection.length === 1 && viewer.inputHandler.selection[0] instanceof Potree.BoxVolume){
					viewer.inputHandler.selection[0].class = classDropdown.val();
				}
			});

			// a colour belongs to a class, not to a single box
			colorDropdown.change(() => {
				existingClasses[classDropdown.val()] = colorDropdown.val();
			});

			viewer.addEventListener("update", (event) => {
				viewer.scene.volumes.forEach((volume) => {
					if(volume.class){
						if(volume.class in existingClasses){
							volume.color = existingClasses[volume.class];
						}else{
							// class came back from a loaded project: give it a colour and list it
							let names = Object.keys(_colorKeywords);
							existingClasses[volume.class] = names[Math.floor(Math.random() * names.length)];
							classDropdown.append(new Option(volume.class, volume.class));
						}
					}
				});

				if(viewer.inputHandler.selection.length === 1 && viewer.inputHandler.selection[0] instanceof Potree.BoxVolume){
					let volume = viewer.inputHandler.selection[0];

					if(!volume.class){
						volume.class = classDropdown.val();
						volume.color = existingClasses[volume.class];
					}
					if(volume.class && volume.color){
						classDropdown.val(volume.class);
						colorDropdown.val(volume.color);
					}

					$("#selectedVolumeInfo").text(`class: ${volume.class}\n color: ${volume.color}`);
				}else{
					$("#selectedVolumeInfo").text("No volume selected");
				}
			});
		});

		// Point cloud to label. Swap this path for your own converted cloud.
		Potree.loadPointCloud("../pointclouds/vol_total/cloud.js", "sigeom.sa", e => {
			let scene = viewer.scene;
			let pointcloud = e.pointcloud;

			let material = pointcloud.material;
			material.size = 1;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.SQUARE;

			scene.addPointCloud(pointcloud);

			viewer.fitToScreen();
		});

	</script>

  </body>
</html>
